[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reliadl"
version = "0.3.0"
description = "Production-grade, fault-tolerant parallel file downloader with per-chunk SHA-256 cryptographic verification."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "PxA-Labs", email = "maintainers@pxalabs.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking"
]
dependencies = [
    "pydantic>=2.13.5",
    "PyYAML>=6.0.3",
    "structlog>=26.1.0",
    "jsonschema>=4.26.0",
    "cryptography>=50.0.1"
]

[project.scripts]
reliadl = "src.cli:main"

[project.urls]
Homepage = "https://github.com/PxA-Labs/ReliaDL"
Documentation = "https://github.com/PxA-Labs/ReliaDL#readme"
Repository = "https://github.com/PxA-Labs/ReliaDL.git"
Issues = "https://github.com/PxA-Labs/ReliaDL/issues"
Discussions = "https://github.com/PxA-Labs/ReliaDL/discussions"

[tool.setuptools]
packages = [
    "reliadl",
    "reliadl.adapters",
    "reliadl.algorithms",
    "reliadl.telemetry",
    "src",
    "src.adapters",
    "src.algorithms",
    "src.telemetry"
]

[tool.setuptools.package-dir]
reliadl = "src"
src = "src"

[tool.setuptools.package-data]
src = ["default_config.yaml", "py.typed"]
reliadl = ["default_config.yaml", "py.typed"]
