ShortDescription: Production-grade fault-tolerant parallel file downloader with per-chunk verification.
Description: |
  ReliaDL is a high-throughput, fault-tolerant file download engine designed for resilient parallel downloads
  over unreliable channels. Features include per-chunk SHA-256 validation, homomorphic LtHash aggregation,
  Merkle segment integrity, SOCKS5/HTTP CONNECT proxy tunneling, and Prometheus telemetry.
