name: Auto Update Changelog

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  update-changelog:
    # Do not run on commits made by github-actions[bot] or when updating CHANGELOG to prevent infinite loop
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'docs: update CHANGELOG.md')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update Changelog File
        run: |
          python scripts/update_changelog.py --before "${{ github.event.before }}" --after "${{ github.event.after }}"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update CHANGELOG.md"
          title: "docs: auto-update CHANGELOG.md"
          body: |
            Automated pull request to update the `docs/CHANGELOG.md` with recent commits from the `master` branch.

            This PR is automatically generated and updated after every successful merge or commit to `master`.
          branch: chore/update-changelog
          base: master
          delete-branch: true
