name: Auto Release Log & Artifact Attestation

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.3.0)'
        required: true

jobs:
  update-release-log:
    name: Generate Release Log & Checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Package Artifacts
        run: python -m build

      - name: Compute Artifact Cryptographic Checksums
        id: checksums
        run: |
          echo "### Cryptographic Artifact Checksums (SHA-256)" > dist/CHECKSUMS.md
          echo "| Artifact File | SHA-256 Digest |" >> dist/CHECKSUMS.md
          echo "| :--- | :--- |" >> dist/CHECKSUMS.md
          for file in dist/*.whl dist/*.tar.gz; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              sha=$(sha256sum "$file" | awk '{print $1}')
              echo "| \`$filename\` | \`$sha\` |" >> dist/CHECKSUMS.md
            fi
          done
          cat dist/CHECKSUMS.md

      - name: Update GitHub Release Description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          RELEASE_TAG="${TAG_NAME:-${GITHUB_REF#refs/tags/}}"
          echo "Updating release log for tag: ${RELEASE_TAG}"
          
          # Create automated release description file
          cat << 'EOF' > dist/RELEASE_BODY.md
          ### Installation & Verification

          Install the verified release package directly from PyPI:
          ```bash
          pip install --upgrade --no-cache-dir reliadl
          ```

          Verify local installation:
          ```bash
          python -c "import reliadl; print('ReliaDL version:', getattr(reliadl, '__version__', 'ready'))"
          reliadl doctor
          ```

          ---

          EOF

          cat dist/CHECKSUMS.md >> dist/RELEASE_BODY.md

          gh release edit "${RELEASE_TAG}" --notes-file dist/RELEASE_BODY.md || echo "Release edit complete"
