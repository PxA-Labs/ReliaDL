name: Continuous Integration & Test Matrix

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-typecheck:
    name: Code Formatting, Linting & Type Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Linting & Typing Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Both of these previously ended in `|| true` and so could never fail a
      # build. A CLI subcommand that called a method which does not exist shipped
      # and stayed broken because of it. Configuration now lives in
      # pyproject.toml so a local checkout enforces exactly what CI does.
      - name: Lint (Ruff)
        run: ruff check reliadl/ tests/ benchmarks/

      - name: Type Checking (MyPy)
        run: mypy

  test-matrix:
    name: Test Matrix (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: lint-and-typecheck
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Test Suite with Pytest
        # The coverage threshold lives in pyproject.toml ([tool.coverage.report]
        # fail_under) so it applies locally too.
        run: |
          python -m pytest --cov=reliadl --cov-report=xml --cov-report=term

      - name: Upload Test Coverage Artifact
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run Security Audit (pip-audit)
        # Was `|| true`, which made the audit decorative. A finding now fails the
        # build; a vulnerability that must be accepted belongs in an explicit
        # --ignore-vuln with a reason, not in a swallowed exit code.
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          if [ -f requirements.txt ]; then pip-audit -r requirements.txt; fi
