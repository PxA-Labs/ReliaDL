name: Continuous Integration & Test Matrix

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-gates:
    name: Quality Gates
    uses: ./.github/workflows/quality-gates.yml

  test-matrix:
    name: Test Matrix (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: quality-gates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Test Suite with Pytest
        # The coverage threshold lives in pyproject.toml ([tool.coverage.report]
        # fail_under) so it applies locally too.
        run: |
          python -m pytest --cov=reliadl --cov-report=xml --cov-report=term

      - name: Upload Test Coverage Artifact
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
